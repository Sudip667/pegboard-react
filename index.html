<script>
  // Set the theme before first paint so there's no dark/light flash on load.
  (function () {
    try {
      var stored = localStorage.getItem("pegboard.theme.v1");
      var theme =
        stored === "light" || stored === "dark"
          ? stored
          : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
